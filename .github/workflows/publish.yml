name: publish

# Runs when a GitHub release is published (or by hand, from a tag ref).
# Skipped unless the repository variable PUBLISH_ENABLED is set to "true".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to Maven Central
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Release tag matches the project version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' does not match project version '$version'"
            exit 1
          fi
      - name: Deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -P release deploy
